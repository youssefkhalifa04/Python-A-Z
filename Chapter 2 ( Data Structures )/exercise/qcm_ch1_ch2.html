<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QCM - Chapters 1 and 2</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0b57d0;
      --success: #0f8a5f;
      --danger: #b42318;
      --warning: #b54708;
      --border: #d0d7e2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .status {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.95rem;
    }

    .pill {
      background: #eef3ff;
      color: #1e3a8a;
      border: 1px solid #c9d8ff;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 600;
    }

    .question {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .q-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .q-title {
      margin: 0;
      font-size: 1.03rem;
    }

    .topic {
      color: var(--muted);
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .options {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fbfcff;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text);
      transition: 0.15s ease;
    }

    .option-btn:hover { border-color: #9bb8f8; background: #f3f7ff; }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.95; }

    .option-btn.correct {
      border-color: #79d2ae;
      background: #ebfff5;
    }

    .option-btn.wrong {
      border-color: #f5a7a0;
      background: #fff3f2;
    }

    .feedback {
      margin-top: 10px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.93rem;
      border: 1px solid transparent;
      display: none;
    }

    .feedback.ok {
      display: block;
      border-color: #79d2ae;
      background: #effcf5;
      color: #075a3b;
    }

    .feedback.bad {
      display: block;
      border-color: #f5a7a0;
      background: #fff3f2;
      color: #7f1d1d;
    }

    .feedback strong {
      display: inline-block;
      margin-right: 6px;
    }

    .footer {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button.main {
      border: 0;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #report {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 20px;
      display: none;
    }

    #report h2 { margin-top: 0; }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fcfdff;
    }

    .good { color: var(--success); font-weight: 700; }
    .warn { color: var(--warning); font-weight: 700; }
    .bad { color: var(--danger); font-weight: 700; }

    ul { margin: 8px 0 0 18px; }
  </style>
</head>

    function renderQuiz() {
      quizEl.innerHTML = "";
      questions.forEach((q, qIndex) => {
        const section = document.createElement("section");
        section.className = "question";

        const head = document.createElement("div");
        head.className = "q-head";
        head.innerHTML = `
          <h3 class="q-title">Q${qIndex + 1}. ${q.question}</h3>
          <span class="topic">${q.topic}</span>
        `;

        const options = document.createElement("div");
        options.className = "options";

        const feedback = document.createElement("div");
        feedback.className = "feedback";
        feedback.id = `feedback-${qIndex}`;

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => answerQuestion(qIndex, optIndex, btn, options, feedback));
          options.appendChild(btn);
        });

        section.appendChild(head);
        section.appendChild(options);
        section.appendChild(feedback);
        quizEl.appendChild(section);
      });

      updateStatus();
    }

      if (resultByQuestion[qIndex] !== null) return;

      const q = questions[qIndex];
      const isCorrect = selectedIndex === q.correct;
      resultByQuestion[qIndex] = {
        correct: isCorrect,
        topic: q.topic,
        focus: q.focus,
        whyWrong: q.whyWrong,
        selectedIndex: selectedIndex
      };

      answered += 1;
      if (isCorrect) score += 1;

      const buttons = optionsEl.querySelectorAll("button");
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add("correct");
        if (i === selectedIndex && !isCorrect) btn.classList.add("wrong");
      });

      if (isCorrect) {
        feedbackEl.className = "feedback ok";
        feedbackEl.innerHTML = `<strong>Correct.</strong>Good understanding. Keep using this reasoning pattern.`;
      } else {
        feedbackEl.className = "feedback bad";
        feedbackEl.innerHTML = `<strong>Incorrect.</strong>${q.whyWrong} <br><strong>Focus:</strong> ${q.focus}`;
      }

      updateStatus();
      if (answered === total) finishBtn.disabled = false;
    }

    function updateStatus() {
      scorePill.textContent = `Score: ${score}`;
      progressPill.textContent = `Answered: ${answered} / ${total}`;
    }

    function buildReport() {
      const percentage = Math.round((score / total) * 100);
      const topicStats = {};
      const weakFocus = [];

      resultByQuestion.forEach((r) => {
        if (!r) return;
        if (!topicStats[r.topic]) {
          topicStats[r.topic] = { total: 0, correct: 0 };
        }
        topicStats[r.topic].total += 1;
        if (r.correct) topicStats[r.topic].correct += 1;
        if (!r.correct) weakFocus.push(`- ${r.topic}: ${r.focus}`);
      });

      let levelClass = "warn";
      let levelText = "Good progress";
      if (percentage >= 85) {
        levelClass = "good";
        levelText = "Strong understanding";
      } else if (percentage < 60) {
        levelClass = "bad";
        levelText = "Needs reinforcement";
      }

      const topicCards = Object.entries(topicStats)
        .map(([topic, stat]) => {
          const pct = Math.round((stat.correct / stat.total) * 100);
          return `
            <div class="card">
              <strong>${topic}</strong><br>
              ${stat.correct} / ${stat.total} correct (${pct}%)
            </div>
          `;
        })
        .join("");

      reportEl.style.display = "block";
      reportEl.innerHTML = `
        <h2>Final Report</h2>
        <p><strong>Final score:</strong> ${score} / ${total} (${percentage}%)</p>
        <p class="${levelClass}">${levelText}</p>

        <h3>Performance by topic</h3>
        <div class="report-grid">${topicCards}</div>

        <h3>What to focus on next</h3>
        ${weakFocus.length ? `<ul>${weakFocus.map((f) => `<li>${f.substring(2)}</li>`).join("")}</ul>` : "<p>Excellent. No weak topics detected in this attempt.</p>"}

        <h3>Recommended next step</h3>
        <p>Re-run the quiz and try to explain each answer aloud in your own words. If you can explain the concept, you truly understand it.</p>
      `;
      reportEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetQuiz() {
      score = 0;
      answered = 0;
      for (let i = 0; i < resultByQuestion.length; i += 1) {
        resultByQuestion[i] = null;
      }
      finishBtn.disabled = true;
      reportEl.style.display = "none";
      reportEl.innerHTML = "";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    finishBtn.addEventListener("click", buildReport);
    resetBtn.addEventListener("click", resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
